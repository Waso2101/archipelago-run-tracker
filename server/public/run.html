<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archipelago Run</title>
<!--PAGE-->
<script src="/common.js?v=20"></script>
<style>
  :root {
    --bg:#15161a; --panel:#1d1f25; --panel2:#24262e; --line:#33363f;
    --fg:#e6e7ea; --dim:#9ba0ab; --accent:#c9a227; --ok:#5fb37a;
    --warn:#d99a3c; --err:#d2635f; --blue:#8fa8d8;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html { color-scheme: dark; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.5 "Segoe UI", system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap;
           padding:12px 20px; background:var(--panel);
           border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
  h1 { font-size:16px; margin:0; font-weight:600; }
  h1 span { color:var(--accent); }
  input, select { background:var(--bg); color:var(--fg); border:1px solid var(--line);
                  border-radius:6px; padding:7px 10px; font:inherit; min-width:0; }
  input:focus, select:focus { outline:1px solid var(--accent); border-color:var(--accent); }
  #key { width:220px; }
  button { background:var(--accent); color:#1a1710; border:none; border-radius:6px;
           padding:8px 15px; font:inherit; font-weight:600; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  button.sub { background:var(--panel2); color:var(--fg); border:1px solid var(--line); }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--err);
         display:inline-block; flex:0 0 auto; }
  .dot.on { background:var(--ok); } .dot.wait { background:var(--warn); }
  #status { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--dim);
            margin-left:auto; }
  main { padding:20px; max-width:1680px; margin:0 auto; }
  .shell { display:grid; grid-template-columns:290px minmax(0,1fr) 340px; gap:16px;
           align-items:start; }
  @media (max-width:1300px) { .shell { grid-template-columns:260px minmax(0,1fr); }
                              .shell .logside { grid-column:1 / -1; position:static; } }
  @media (max-width:860px)  { .shell { grid-template-columns:minmax(0,1fr); }
                              .side { position:static; }
                              main { padding:16px; } header { padding:10px 16px; }
                              #key { width:100%; order:5; } #status { margin-left:0; } }
  .side { background:var(--panel); border:1px solid var(--line); border-radius:8px;
          position:sticky; top:66px; }
  .phead { padding:10px 14px; border-bottom:1px solid var(--line); font-size:13px;
           text-transform:uppercase; letter-spacing:.6px; color:var(--dim);
           display:flex; align-items:center; gap:8px; }
  .phead .n { margin-left:auto; color:var(--accent); letter-spacing:0; }
  .loc.hinted { background:#2a2614; box-shadow:inset 3px 0 0 var(--accent); }
  .loc.flash { outline:2px solid var(--accent); outline-offset:-2px; }
  .tag.hint { background:#3a3320; color:var(--accent); }
  summary .hcount { color:var(--accent); font-size:13px; }
  .jump { background:none; border:none; color:var(--accent); padding:0 3px; font:inherit;
          cursor:pointer; font-weight:600; }
  .jump:hover { text-decoration:underline; }
  #hintbox .irow .t { cursor:pointer; }
  #hintbox .isec { max-height:340px; overflow:auto; }
  .logfilter { display:flex; gap:6px; padding:8px 14px; border-bottom:1px solid var(--line); }
  .logfilter select { flex:1; padding:4px 6px; font-size:13px; }
  .pbody { padding:10px 14px; max-height:74vh; overflow:auto; }
  .seed { font-size:13px; color:var(--dim); padding:0 0 10px;
          border-bottom:1px solid var(--line); margin-bottom:6px; word-break:break-all; }
  .seed b { color:var(--fg); font-weight:500; }
  .pl { padding:9px 8px; margin:0 -8px; border-radius:6px; cursor:pointer;
        border-bottom:1px solid var(--line); }
  .pl:last-child { border-bottom:none; }
  .pl:hover { background:var(--panel2); }
  .pl.sel { background:var(--panel2); box-shadow:inset 3px 0 0 var(--accent); }
  .pl .top { display:flex; align-items:baseline; gap:7px; }
  .pl .nm { font-weight:600; }
  .pl.me .nm { color:var(--accent); }
  .pl .deaths { font-size:12px; color:var(--err); margin-left:auto; flex:0 0 auto; }
  .pl .gm { color:var(--dim); font-size:12px; margin-left:auto; text-align:right; }
  .pl .deaths + .gm { margin-left:8px; }
  .pl .ck { display:flex; align-items:center; gap:7px; margin-top:4px;
            font-size:12px; color:var(--dim); }
  .pl .ck .bar { flex:1; }
  .pl .ck .num { font-variant-numeric:tabular-nums; }
  .pl .lastit { font-size:12px; color:var(--dim); margin-top:3px; white-space:nowrap;
                overflow:hidden; text-overflow:ellipsis; }
  .pl .lastit b { color:var(--fg); font-weight:500; }
  .pl .st { font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--ok); }
  #log { padding:6px 0; max-height:74vh; overflow:auto; font-size:13px; }
  .ev { display:flex; gap:8px; padding:5px 14px; border-bottom:1px solid var(--line);
        align-items:baseline; }
  .ev:last-child { border-bottom:none; }
  .ev .ts { color:var(--dim); font-variant-numeric:tabular-nums; flex:0 0 auto; }
  .ev .tx { flex:1; word-break:break-word; }
  .p { color:var(--blue); } .p.me { color:var(--accent); }
  .i { color:var(--fg); } .i.prog { color:var(--ok); }
  .l { color:var(--dim); }
  .ev.death .tx { color:var(--err); }
  .ev.goal .tx { color:var(--ok); }
  .ev.system .tx { color:var(--warn); }
  .opts { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .opt { background:var(--panel2); border:1px solid var(--line); border-radius:6px;
         padding:5px 10px; font-size:13px; }
  .opt b { color:var(--accent); }
  .tbar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
  .tbar input[type=search] { width:260px; max-width:100%; }
  .checkbox { display:flex; align-items:center; gap:7px; font-size:14px; }
  .checkbox input { width:auto; }
  .bar { height:5px; background:var(--panel2); border-radius:3px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--ok); transition:width .25s; }
  #overall { margin-bottom:18px; }
  #overall .bar { height:8px; }
  #overall .lbl { display:flex; justify-content:space-between; font-size:13px;
                  color:var(--dim); margin-bottom:6px; }
  details.region { background:var(--panel); border:1px solid var(--line);
                   border-radius:8px; margin-bottom:8px; overflow:hidden; }
  details.region[data-done="1"] { opacity:.5; }
  details.region > summary { padding:11px 14px; cursor:pointer; display:flex;
            align-items:center; gap:12px; list-style:none; font-weight:500; }
  summary::-webkit-details-marker { display:none; }
  summary .idx { color:var(--dim); font-size:13px; min-width:26px;
                 font-variant-numeric:tabular-nums; }
  summary .count { margin-left:auto; color:var(--dim); font-size:13px;
                   font-variant-numeric:tabular-nums; }
  summary .bar { width:80px; flex:0 0 auto; }
  .locs { border-top:1px solid var(--line); padding:4px 0; }
  .loc { display:flex; gap:9px; align-items:flex-start; padding:6px 14px 6px 40px;
         font-size:14px; flex-wrap:wrap; }
  .loc:hover { background:var(--panel2); }
  .loc.done .n { text-decoration:line-through; color:var(--dim); }
  .loc .mark { flex:0 0 auto; width:15px; text-align:center; color:var(--dim); }
  .loc.done .mark { color:var(--ok); }
  .loc .n { flex:1; min-width:200px; }
  .loc .it { color:var(--dim); font-size:13px; }
  .loc .it.real { color:var(--fg); }
  .loc .who { flex:0 0 auto; font-size:12px; padding:1px 7px; border-radius:4px;
              background:var(--panel2); color:var(--blue); border:1px solid var(--line);
              margin-top:1px; }
  .loc .who.mine { color:var(--accent); }
  .loc .info { flex:0 0 auto; color:var(--dim); cursor:pointer; border:none;
               background:none; font:inherit; padding:0 4px; }
  .loc .info:hover { color:var(--accent); }
  .tag { font-size:11px; text-transform:uppercase; letter-spacing:.5px; padding:1px 6px;
         border-radius:4px; flex:0 0 auto; margin-top:2px; }
  .tag.miss { background:#3a3320; color:var(--warn); }
  .tag.boss { background:#2b2f3d; color:var(--blue); }
  .tag.prog { background:#243225; color:var(--ok); }
  .empty { color:var(--dim); padding:34px; text-align:center; }
  .banner { background:#2a2420; border:1px solid var(--warn); color:var(--warn);
            padding:10px 14px; border-radius:8px; margin-bottom:16px; font-size:14px; }
  .tabs { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .tab { background:var(--panel2); color:var(--dim); border:1px solid var(--line);
         font-weight:500; }
  .tab.on { background:var(--accent); color:#1a1710; border-color:var(--accent); }
  /* Per-player tracker on the public page (tabs are .mtab so the owner tabs' handler skips them) */
  .mtab { background:var(--panel2); color:var(--dim); border:1px solid var(--line); font-weight:500; }
  .mtab.on { background:var(--accent); color:#1a1710; border-color:var(--accent); }
  a.mtab { display:inline-flex; align-items:center; padding:8px 15px; border-radius:6px; text-decoration:none; }
  a.mtab.extra { color:var(--accent); border-color:#5a4a1c; background:#241f12; }
  a.mtab.extra:hover { filter:brightness(1.15); }
  #whopick { width:auto; max-width:min(320px, 100%); padding:6px 10px; font-weight:600;
             border-color:#5a4a1c; }
  .mt-title { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin:0 0 14px; }
  .mt-title .nm { font-size:28px; font-weight:700; color:var(--accent); line-height:1.2; word-break:break-word; }
  .mt-title .gm { color:var(--dim); font-size:16px; }
  .mt-title .back { margin-left:auto; }
  #mytrk .pstat .v { font-size:32px; }
  #mytrk .pstat .s { color:var(--dim); font-size:13px; }
  .pcard { cursor:pointer; }
  .pcard:hover { border-color:#4a4d57; }
  .loc .hintfor { font-size:13px; color:var(--accent); }
  .runlink { color:var(--fg) !important; text-decoration:none; }
  .runlink:hover { color:var(--accent) !important; }
  .logdl { margin-left:10px; font-size:13px; text-transform:none; letter-spacing:0; text-decoration:none; opacity:.85; }
  .logdl:hover { opacity:1; }
  .mtoverall { margin-bottom:14px; }
  .mtoverall .bar { height:8px; }
  .mtoverall .lbl { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;
                    font-size:13px; color:var(--dim); margin-bottom:6px; }
  .note { color:var(--dim); font-size:13px; margin:-6px 0 14px; }
  .isec { background:var(--panel); border:1px solid var(--line); border-radius:8px;
          padding:14px 16px; margin-bottom:10px; }
  .isec h2 { font-size:14px; margin:0 0 4px; font-weight:600; }
  .isec p { color:var(--dim); font-size:13px; margin:0 0 10px; }
  .irow { display:flex; gap:10px; padding:5px 0; font-size:14px;
          border-top:1px solid var(--line); flex-wrap:wrap; }
  .irow .c { color:var(--accent); min-width:44px; font-variant-numeric:tabular-nums; }
  .irow .t { flex:1; min-width:160px; }
  .irow .w { color:var(--dim); font-size:13px; margin-left:auto; text-align:right; }
  .irow.click { cursor:pointer; } .irow.click:hover { background:var(--panel2); }
  .who-card { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));
              gap:10px; margin-bottom:16px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:8px;
          padding:12px 14px; }
  .stat .k { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.5px; }
  .stat .v { font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; }
  .stat .v.err { color:var(--err); }
  .stat .s { color:var(--dim); font-size:13px; word-break:break-word; }
  .pv-title { display:flex; align-items:baseline; gap:10px; margin:0 0 14px; flex-wrap:wrap; }
  .pv-title h2 { margin:0; font-size:18px; }
  .pv-title .g { color:var(--dim); }
  dialog { background:var(--panel); color:var(--fg); border:1px solid var(--line);
           border-radius:10px; padding:0; max-width:620px; width:calc(100% - 32px); }
  dialog::backdrop { background:#000a; }
  dialog .dh { padding:16px 20px 12px; border-bottom:1px solid var(--line); }
  dialog .dh h2 { margin:0 0 4px; font-size:16px; }
  dialog .dh .sub { color:var(--dim); font-size:13px; }
  dialog .db { padding:16px 20px; }
  dialog .row { display:flex; gap:12px; padding:6px 0; font-size:14px;
                border-bottom:1px solid var(--line); }
  dialog .row:last-child { border-bottom:none; }
  dialog .row .k { color:var(--dim); min-width:120px; flex:0 0 auto; }
  dialog .row .v { flex:1; }
  dialog .way { background:var(--bg); border:1px solid var(--line); border-radius:6px;
                padding:10px 12px; margin:4px 0 10px; line-height:1.6; }
  dialog .leg { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  dialog .leg span { font-size:12px; background:var(--panel2); border:1px solid var(--line);
                     border-radius:4px; padding:1px 7px; color:var(--dim); }
  dialog .df { padding:12px 20px; border-top:1px solid var(--line);
               display:flex; gap:8px; align-items:center; }
  a { color:var(--accent); }
  .linkform { margin-top:8px; display:flex; flex-direction:column; gap:6px; }
  .linkform .row2 { display:flex; gap:6px; }
  .linkform input { flex:1; padding:5px 8px; font-size:13px; }
  .linkform button { padding:5px 10px; font-size:13px; }
  .linkform .err { color:var(--err); }
  h1 a.home { color:var(--dim); text-decoration:none; margin-right:4px; }
  h1 a.home:hover { color:var(--accent); }
  .hnav { display:flex; gap:14px; font-size:14px; align-items:center; flex-wrap:wrap; }
  .pl .st.rel, .pcard .gl.rel { color:var(--warn); }
  .i.use { color:var(--blue); } .i.trap { color:var(--err); }
  .logend { padding:12px 14px; text-align:center; color:var(--dim); font-size:13px; }
  .tiles { display:flex; gap:6px; }
  .tiles button { background:var(--panel2); color:var(--dim); border:1px solid var(--line);
                  padding:6px 14px; font-size:14px; }
  .tiles button.on { background:var(--accent); color:#1a1710; border-color:var(--accent); }
  .loc .mark.reach { color:var(--ok); }
  .loc.locked { opacity:.55; }
  .popinfo { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 14px;
             margin-bottom:12px; font-size:14px; color:var(--dim); }
  .popinfo.err { color:var(--warn); border-color:#5a4520; }
  .pill { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
          text-transform:uppercase; letter-spacing:.5px; padding:2px 9px; border-radius:20px;
          border:1px solid var(--line); background:var(--panel2); color:var(--dim); white-space:nowrap;
          vertical-align:middle; margin-left:8px; }
  .pill.done { color:var(--ok); border-color:#2f5a3c; }
  .pill.partial { color:var(--warn); border-color:#5a4520; background:#2a2418; }
  .langtoggle { position:fixed; right:16px; bottom:16px; z-index:50; background:var(--panel);
                color:var(--dim); border:1px solid var(--line); border-radius:8px; padding:7px 12px;
                font-weight:600; font-size:13px; box-shadow:0 4px 16px #0006; }
  .langtoggle:hover { filter:none; color:var(--fg); }
  .langtoggle .on { color:var(--accent); }

  /* ---------- Viewer view (/) ---------- */
  #pub { padding:20px; max-width:1800px; margin:0 auto; }
  .pubgrid { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(380px,1fr); gap:20px;
             align-items:start; }
  @media (max-width:1100px) { .pubgrid { grid-template-columns:minmax(0,1fr); }
                              .publog { position:static !important; }
                              .publog #publog { max-height:70vh !important; } }
  @media (max-width:600px) { #pub { padding:12px 16px; } }
  .pubtop { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:12px;
            margin-bottom:16px; }
  .pstat { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 18px; }
  .pstat .k { color:var(--dim); font-size:13px; text-transform:uppercase; letter-spacing:.6px; }
  .pstat .v { font-size:40px; font-weight:700; line-height:1.15; font-variant-numeric:tabular-nums; }
  .pstat .v.err { color:var(--err); }
  .pstat.lastdeath { grid-column:span 2; border-color:#4a2a2c;
                     background:radial-gradient(120% 140% at 0% 0%, #2c1517 0%, var(--panel) 65%); }
  @media (max-width:600px) { .pstat.lastdeath { grid-column:1 / -1; } }
  .ld-name { font-size:24px; font-weight:700; color:#ff8d8d; margin-top:2px; }
  .ld-cause { color:#cfc6c8; font-style:italic; font-size:16px; word-break:break-word; }
  .ld-time { color:var(--dim); font-size:13px; margin-top:4px; }
  .pplayers { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:14px; }
  @media (max-width:420px) { .pplayers { grid-template-columns:minmax(0,1fr); } }
  .pcard { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px;
           display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 16px; align-items:center;
           transition:box-shadow .3s; }
  .pcard.me { border-color:#5a4a1c; }
  .pcard.top { border-color:#5a2a2c; box-shadow:0 0 22px #d2635f22; }
  .pcard .nm { font-size:24px; font-weight:700; line-height:1.2; word-break:break-word; }
  .pcard.me .nm { color:var(--accent); }
  .pcard .gm { color:var(--dim); font-size:14px; }
  .pcard .dc { grid-row:1 / span 2; grid-column:2; text-align:right; color:var(--err);
               font-size:46px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
  .pcard .dc small { display:block; font-size:12px; font-weight:500; color:var(--dim);
                     text-transform:uppercase; letter-spacing:.6px; margin-top:4px; }
  .pcard .dc.zero { color:var(--dim); opacity:.6; }
  .pcard .pr { grid-column:1 / -1; display:flex; align-items:center; gap:10px; margin-top:10px;
               font-size:15px; color:var(--dim); font-variant-numeric:tabular-nums; }
  .pcard .pr .bar { flex:1; height:8px; }
  .pcard .pr b { color:var(--fg); font-weight:600; }
  .pcard .la { grid-column:1 / -1; font-size:14px; color:var(--dim); margin-top:6px;
               white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pcard .gl { grid-column:1 / -1; font-size:13px; text-transform:uppercase; letter-spacing:.5px;
               color:var(--ok); margin-top:4px; }
  .pcard.flash, .pstat.flash { animation:deathflash 1.8s ease-out; }
  @keyframes deathflash { 0%, 25% { box-shadow:0 0 0 3px var(--err), 0 0 30px #d2635f99; }
                          100% { box-shadow:none; } }
  .publog { background:var(--panel); border:1px solid var(--line); border-radius:10px;
            position:sticky; top:72px; }
  .publog .phead { font-size:14px; }
  .publog .logfilter { flex-wrap:wrap; }
  .publog .logfilter select, .publog .logfilter input { font-size:14px; padding:5px 8px; }
  .publog .logfilter input { flex:2 1 160px; }
  #publog { max-height:calc(100vh - 190px); overflow:auto; font-size:16px; padding:4px 0; }
  #publog .ev { padding:8px 16px; gap:12px; }
  #publog .ev.death { background:#d2635f12; }
  #publog .ev.death .tx { font-weight:600; }
  .ev.fresh { animation:fresh 2.5s ease-out; }
  @keyframes fresh { 0% { background:#c9a22740; } 100% { background:transparent; } }
  @media (prefers-reduced-motion: reduce) { .pcard.flash, .pstat.flash, .ev.fresh { animation:none; } }
</style>

<body>

<header>
  <h1><a class="brand" href="/" title="Alle Runs"><span class="logo" aria-hidden="true"></span><span class="bt">{{SITE_NAME}}</span></a><span class="crumb">›</span><a id="htitle" class="runlink" href="#">Archipelago Run</a><span id="hpill"></span></h1>
  <select id="whopick" hidden title="Wer bist du? Zeigt deinen eigenen Tracker."></select>
  <div id="status"><span class="dot" id="dot"></span><span id="stxt">lade…</span></div>
</header>

<main id="pub" hidden>
  <div id="pubempty" class="empty" hidden data-i18n="runNotFound">Diesen Run gibt es nicht.</div>
  <div class="pubgrid" id="pubgrid">
    <section>
      <div id="overview">
        <div class="pubtop">
          <div class="pstat"><div class="k" data-i18n="totalDeaths">Tode gesamt</div><div class="v err" id="ptotal">0</div></div>
          <div class="pstat"><div class="k" data-i18n="totalChecks">Checks gesamt</div><div class="v" id="pchecks">0</div></div>

</main>

<script>
"use strict";

const $ = id => document.getElementById(id);
const POLL_MS = 4000;
// /run-N is the overview; /run-N/<game>/poptracker one player's own tracker.
// The server writes what this address shows: the overview or one player's PopTracker.
const PAGE = window.PAGE || { run: Number((/^\/run-(\d+)/.exec(location.pathname) || [])[1]), mode: "overview" };
const RUN = Number(PAGE.run);
const PUBLIC = true;   // this build has only the public pages
const API = `/api/run/${RUN}/`;
const LOGFILE = `/run-${RUN}/log`;
const L = PUBLIC ? "pub" : "";   // id prefix of the log that is on screen

Object.assign(I18N.de, {
  totalDeaths: "Tode gesamt", totalChecks: "Checks gesamt", lastDeath: "Letzter Tod", log: "Log",
  all: "alle", everything: "alles", got: "Item bekommen", gave: "Item gegeben", items: "Items insgesamt",
  deathsF: "Tode", hints: "Hints", other: "Sonstiges", searchLog: "Im Log suchen…",
  nothing: "noch nichts passiert.", notFound: "nichts gefunden.", deathsSmall: "Tode", checks: "Checks",
  last: "zuletzt: ", goal: "Ziel erreicht", released: "released, Ziel nicht erreicht",
  noDeath: "noch keiner gestorben", live: "live", connecting: "verbinde…", offline: "Raum gerade offline",
  ended: "beendet", unreachable: "Tracker-Server nicht erreichbar", runNotFound: "Diesen Run gibt es nicht.",
  logFile: "Log-Datei", overview: "Übersicht", settings: "Einstellungen",
  loadingMore: "mehr…", loadingOlder: "lade ältere Einträge…", logStart: "· Anfang des Logs ·", run: "Archipelago Run #{n}",
  completed: "Completed", partial: "Completed: {x}/{y}", allRuns: "alle Runs",
  whoOverview: "Übersicht (alle Spieler)", whoTitle: "Wer bist du? Zeigt deinen eigenen Tracker.",
  backOverview: "Übersicht", mtItems: "Items", mtSearch: "Region oder Ort suchen…",
  showLocked: "Gesperrte zeigen", showDone: "Erledigte zeigen", loading: "lade…",
  stChecks: "Checks", stReach: "Jetzt erreichbar", stItems: "Items erhalten", stDeaths: "Tode",
  stReachSub: "offene Orte, die du mit deinen Items schaffst", stItemsSub: "von dir selbst und anderen",
  stChecksSub: "erledigt", reachN: "{n} erreichbar", openN: "{n} offen",
  ovPop: "{r} erreichbar · {o} offen · {d} / {t} erledigt", ovLbl: "Jetzt erreichbar",
  popNote: "Logik der {game}-Welt aus Archipelago · {n} Items · {ms} ms",

  popCalc: "berechne, was {name} gerade erreichen kann… (beim ersten Mal kann das etwas dauern)",
  popNothing: "Gerade ist nichts Neues erreichbar. Erst braucht es weitere Items.",

  reachable: "jetzt erreichbar", locked: "noch gesperrt", doneMark: "erledigt",

  itemsNew: "Zuletzt bekommen", itemsNewSub: "die neuesten mit Uhrzeit, seit der Tracker mitzählt",
  noItems: "noch nichts angekommen.", from: "von {p}",
  hintsMine: "Deine Items in anderen Welten", hintsMineSub: "{n} gehintet. Haken = schon gefunden.",
  hintsWanted: "In deiner Welt gesucht", hintsWantedSub: "{n} Items anderer Spieler liegen gehintet bei dir.",
  noHints: "keine Hints.",
  srcLog: "Ohne Raum-Link nur aus dem Log, seit der Tracker mitzählt.",
});
Object.assign(I18N.en, {
  whoOverview: "Overview (all players)", whoTitle: "Who are you? Shows your own tracker.",
  backOverview: "Overview", mtItems: "Items", mtSearch: "Search region or location…",
  showLocked: "Show locked", showDone: "Show checked", loading: "loading…",
  stChecks: "Checks", stReach: "In logic now", stItems: "Items received", stDeaths: "Deaths",
  stReachSub: "open locations your items can reach", stItemsSub: "from yourself and others",
  stChecksSub: "checked", reachN: "{n} in logic", openN: "{n} open",
  ovPop: "{r} in logic · {o} open · {d} / {t} checked", ovLbl: "In logic now",
  popNote: "Logic of the {game} world from Archipelago · {n} items · {ms} ms",
  popUnknown: " · {n} items unknown to the logic",
  popCalc: "working out what {name} can reach right now… (the first time can take a moment)",
  popNothing: "Nothing new is reachable right now. More items are needed first.",
  allDone: "Everything checked.", noHits: "no matches", doneList: "Checked locations", hintHere: "wanted: {i} → {p}",
  reachable: "in logic now", locked: "still locked", doneMark: "checked",
  itemsGot: "Received", itemsGotSub: "{n} items arrived, by count. Green = progression.",
  itemsNew: "Latest", itemsNewSub: "the newest with time, since the tracker started counting",
  noItems: "nothing arrived yet.", from: "from {p}",
  hintsMine: "Your items in other worlds", hintsMineSub: "{n} hinted. Check mark = already found.",
  hintsWanted: "Wanted from your world", hintsWantedSub: "{n} items of other players are hinted in your world.",
  noHints: "no hints.",
  srcLog: "Without the room link only from the log, since the tracker started counting.",
  totalDeaths: "Total deaths", totalChecks: "Total checks", lastDeath: "Last death", log: "Log",
  all: "everyone", everything: "everything", got: "Item received", gave: "Item sent", items: "All items",
  deathsF: "Deaths", hints: "Hints", other: "Other", searchLog: "Search the log…",
  nothing: "nothing happened yet.", notFound: "nothing found.", deathsSmall: "Deaths", checks: "checks",
  last: "last: ", goal: "Goal reached", released: "released, goal not reached",
  noDeath: "nobody died yet", live: "live", connecting: "connecting…", offline: "room offline right now",
  ended: "ended", unreachable: "tracker server not reachable", runNotFound: "This run does not exist.",
  logFile: "Log file", overview: "Overview", settings: "Settings",
  loadingMore: "more…", loadingOlder: "loading older entries…", logStart: "· start of the log ·", run: "Archipelago Run #{n}",
  completed: "Completed", partial: "Completed: {x}/{y}", allRuns: "all runs",
});
// Texts the server writes in German; shown in English when asked.
const SYS_EN = [
  [/^ ist gestorben$/, " died"], [/^Verbindung zum Raum verloren$/, "Lost connection to the room"],
  [/^Wieder verbunden, Log geht weiter$/, "Reconnected, log continues"],
  [/^Raum läuft jetzt auf Port (\d+)$/, "Room is now on port $1"],
];
const sysText = s => { if (LANG !== "en") return s; for (const [re, to] of SYS_EN) if (re.test(s)) return s.replace(re, to); return s; };
let room = null;                 // from /api/state
let players = [];                // [{slot,name,game,checks,deaths,goal,last}]
let mySlot = null;
let events = [];                 // newest first
let lastEventId = 0;
let pollTimer = null;
const playerBy = s => players.find(p => p.slot === s);
const playerName = s => (playerBy(s) || {}).name || (s == null ? "?" : "Slot " + s);
const prettyGame = g => (g || "?").replace(/([a-z0-9])([A-Z])/g, "$1 $2").replace(/([a-z])(\d)/g, "$1 $2");
/** "12,3 %" with one decimal, so early progress does not read as 0 %. */
const pct = (a, b) => (b ? (a / b * 100) : 0).toLocaleString(locale(), { maximumFractionDigits: 1 }) + " %";
const ago = fmtAgo;

// ---------------------------------------------------------------------------
// Polling
// ---------------------------------------------------------------------------
/** Header: run name, Completed pill, links. */
function renderHeader() {
  if (!room) return;
  const name = room.title || t("run", { n: room.id });
  $("htitle").textContent = name;
  document.title = name + " · " + (window.SITE ? SITE.name : "Archipelago Run Tracker");
  const pill = $("hpill");
  pill.innerHTML = "";
  if (room.ended) {
    const n = players.length, x = players.filter(p => p.goal).length;
    const s = document.createElement("span");
    s.className = "pill " + (n && x >= n ? "done" : "partial");
    s.textContent = n && x >= n ? t("completed") : t("partial", { x, y: n });
    pill.appendChild(s);
  }
  // The run name leads back to the overview of this run.
  $("htitle").href = `/run-${RUN}`;
  $("htitle").onclick = e => { if (PUBLIC) { e.preventDefault(); pickWho(null); } };
  $("logdl").href = LOGFILE;
}

function liveStatus() {
  return room.ended ? [t("ended"), ""]
    : room.status === "verbunden" ? [t("live"), "on"]
    : room.status === "verbinde" ? [t("connecting"), "wait"]
    : PUBLIC ? [t("offline"), ""] : [room.status + (room.error ? " - " + room.error : ""), ""];
}

/** Which of my locations the received items reach, from the logic service (PopTracker view). */
/** Regions to show: the world's own (from the logic service) or the tracker's. */
function setStatus(text, cls) {
  $("stxt").textContent = text;
  $("dot").className = "dot" + (cls ? " " + cls : "");
}

// ---------------------------------------------------------------------------
// Centre, someone else: their checks only.
// ---------------------------------------------------------------------------
function irow(count, text, where, onClick) {
  const d = document.createElement("div");
  d.className = "irow" + (onClick ? " click" : "");
  if (onClick) { d.onclick = onClick; d.title = "Wegbeschreibung"; }
  d.innerHTML = `<span class="c"></span><span class="t"></span><span class="w"></span>`;
  if (count instanceof Node) d.querySelector(".c").appendChild(count);
  else d.querySelector(".c").textContent = count == null ? "" : count;
  if (text instanceof Node) d.querySelector(".t").appendChild(text);
  else d.querySelector(".t").textContent = text;
  d.querySelector(".w").textContent = where || "";
  return d;
}

function itemSpan(name, flags, receiver) {
  const f = document.createDocumentFragment();
  const i = document.createElement("span");
  i.className = "i" + ((flags & 1) ? " prog" : "");
  i.textContent = name || "?";
  f.appendChild(i);
  if (receiver != null) {
    f.appendChild(document.createTextNode(" → "));
    const p = document.createElement("span");
    p.className = "p" + (receiver === mySlot ? " me" : "");
    p.textContent = playerName(receiver);
    f.appendChild(p);
  }
  return f;
}

// ---------------------------------------------------------------------------
// Right: log
// ---------------------------------------------------------------------------
function partNode(part) {
  const s = document.createElement("span");
  switch (part.type) {
    case "player": s.className = "p" + (part.slot === mySlot ? " me" : ""); break;
    case "item": s.className = "i" + ((part.flags & 1) ? " prog" : (part.flags & 4) ? " trap" : (part.flags & 2) ? " use" : ""); break;
    case "location": s.className = "l"; break;
  }
  if (part.type === "text" && part.text.trim() === "\u2620") { s.appendChild(icEl("skull")); s.append(" "); return s; }
  s.textContent = part.type === "text" ? sysText(part.text) : part.text;
  return s;
}

/** Who an event is about. For item sends the first player is the finder, the second the receiver. */
function evRoles(e) {
  const sl = e.slots || [];
  if (e.kind === "itemsend") return { giver: sl[0], getter: sl.length > 1 ? sl[1] : sl[0], all: sl };
  return { giver: null, getter: null, all: sl };
}

function renderLogWho() {
  const sel = $(L + "logwho");
  const cur = sel.value;
  const listed = players.filter(p => PUBLIC || p.slot !== mySlot);
  const want = [...(PUBLIC ? ["all"] : ["all", "me", "others"]), ...listed.map(p => "s" + p.slot)];
  if ([...sel.options].map(o => o.value).join() === want.join()) return;
  sel.innerHTML = PUBLIC ? `<option value="all">${t("all")}</option>`
    : `<option value="all">alle</option><option value="me">ich</option><option value="others">andere</option>`;
  for (const p of listed) {
    const o = document.createElement("option");
    o.value = "s" + p.slot;
    o.textContent = p.name;
    sel.appendChild(o);
  }
  sel.value = want.includes(cur) ? cur : "all";
}

let freshIds = new Set();        // events from the latest poll, briefly highlighted
// The log draws LOG_STEP rows and more when its end scrolls into view, down to the first entry.
const LOG_STEP = 400;
let logLimit = LOG_STEP, lastLogSig = "";
const logObserver = new IntersectionObserver(es => {
  if (es.some(e => e.isIntersecting) && logHasMore) { logLimit += LOG_STEP; renderLog(); }
}, { root: $(L + "log"), rootMargin: "400px" });
let logHasMore = false;

function renderLog() {
  const host = $(L + "log");
  renderLogWho();
  const who = $(L + "logwho").value, what = $(L + "logwhat").value;
  const search = $(L + "logq") ? $(L + "logq").value.trim().toLowerCase() : "";
  const sig = [events.length, lastEventId, who, what, search, LANG, logLimit, olderDone, mySlot, players.length].join("|");
  if (sig === lastLogSig) return;
  lastLogSig = sig;
  // "Is this slot one of the people the filter means?"
  const isWho = who === "all" ? () => true
    : who === "me" ? s => s === mySlot
    : who === "others" ? s => s != null && s !== mySlot
    : s => s === Number(who.slice(1));
  const list = events.filter(e => {
    const r = evRoles(e);
    switch (what) {
      case "got":   return e.kind === "itemsend" && isWho(r.getter);
      case "gave":  return e.kind === "itemsend" && r.giver !== r.getter && isWho(r.giver);
      case "items": return e.kind === "itemsend" && (isWho(r.giver) || isWho(r.getter));
      case "death": return e.kind === "death" && (who === "all" || r.all.some(isWho));
      case "hint":  return e.kind === "hint" && (who === "all" || r.all.some(isWho));
      case "other": return e.kind !== "itemsend" && e.kind !== "death" && e.kind !== "hint" && (who === "all" || r.all.some(isWho));
      default:      return who === "all" || r.all.some(isWho);
    }
  }).filter(e => !search || e.parts.map(x => x.text).join("").toLowerCase().includes(search));
  $(L + "logn").textContent = list.length || "";
  if (!list.length) {
    host.innerHTML = `<div class="empty">${events.length ? t("notFound") : t("nothing")}</div>`;
    if (!olderDone) host.innerHTML += `<div class="logend">${t("loadingOlder")}</div>`;
    return;
  }
  host.innerHTML = "";
  for (const e of list.slice(0, logLimit)) {
    const row = document.createElement("div");
    row.className = "ev " + e.kind + (freshIds.has(e.id) ? " fresh" : "");
    const ts = document.createElement("span");
    ts.className = "ts";
    const d = new Date(e.t);
    // Runs over several days: older entries get the date as well.
    ts.textContent = Date.now() - e.t > 20 * 3600_000
      ? d.toLocaleDateString(locale(), { day: "2-digit", month: "2-digit" }) + " " + fmtTime(e.t) : fmtTime(e.t);
    ts.title = d.toLocaleString(locale());
    row.appendChild(ts);
    const tx = document.createElement("span");
    tx.className = "tx";
    for (const part of e.parts) tx.appendChild(partNode(part));
    row.appendChild(tx);
    host.appendChild(row);
  }
  logHasMore = list.length > logLimit;
  const end = document.createElement("div");
  end.className = "logend";
  end.textContent = logHasMore ? t("loadingMore") : olderDone ? t("logStart") : t("loadingOlder");
  host.appendChild(end);
  logObserver.disconnect();
  if (logHasMore) logObserver.observe(end);
}
const refilter = () => { logLimit = LOG_STEP; $(L + "log").scrollTop = 0; renderLog(); };
["publogwho", "publogwhat"].forEach(id => $(id).addEventListener("change", refilter));
$("publogq").addEventListener("input", refilter);

function tag(text, cls) {
  const t = document.createElement("span");
  t.className = "tag " + cls;
  t.textContent = text;
  return t;
}

/** Remember which regions are open so a poll does not collapse them. */
function isec(title, sub) {
  const d = document.createElement("div");
  d.className = "isec";
  d.innerHTML = `<h2></h2><p></p>`;
  d.querySelector("h2").textContent = title;
  d.querySelector("p").textContent = sub;
  return d;
}

/** Merge newly polled events (newest first) and remember which ones are new. */
let oldestId = Infinity, olderDone = false, olderBusy = false;
function takeEvents(list, total) {
  const first = !lastEventId && total != null;
  freshIds = new Set(lastEventId ? list.map(e => e.id) : []);
  if (list.length) {
    events = list.concat(events).sort((a, b) => b.t - a.t || b.id - a.id);
    for (const e of list) { if (e.id > lastEventId) lastEventId = e.id; if (e.id < oldestId) oldestId = e.id; }
  }
  if (first) {
    if (total <= list.length) olderDone = true;
    else loadOlder();
  }
}

/** The rest of the log, page by page in the background (search and filters then cover all of it). */
async function loadOlder() {
  if (olderBusy || olderDone) return;
  olderBusy = true;
  try {
    for (;;) {
      const r = await fetch(`${API}events?before=${oldestId}&limit=2000`);
      const j = await r.json();
      const list = j.events || [];
      for (const e of list) if (e.id < oldestId) oldestId = e.id;
      events = events.concat(list).sort((a, b) => b.t - a.t || b.id - a.id);
      if (list.length < 2000) { olderDone = true; break; }
    }
  } catch (e) { setTimeout(() => { olderBusy = false; loadOlder(); }, 10000); return; }
  olderBusy = false;
  if (PUBLIC) renderPublic();
  renderLog();
}

// ---------------------------------------------------------------------------
// Public view: players, deaths and the log, big, for everyone watching.
// ---------------------------------------------------------------------------
const prevDeaths = new Map();

async function pollPublic() {
  clearTimeout(pollTimer);
  try {
    const r = await fetch(`${API}state?since=${lastEventId}`);
    if (r.status === 404) {
      $("pubgrid").hidden = true; $("pubempty").hidden = false;
      setStatus(t("runNotFound"), "");
      return;
    }
    const j = await r.json();
    room = j.room; players = j.players; mySlot = room.my_slot;
    takeEvents(j.events, j.events_total);
    $("pubgrid").hidden = false; $("pubempty").hidden = true;
    const st = liveStatus();
    setStatus(st[0], st[1]);
    renderHeader(); renderPublic();
    // The player picked last time (or in the link), once the player list is known.
    if (!whoApplied && players.length) { whoApplied = true; if (PAGE.mode === "player" && playerBy(PAGE.slot)) pickWho(PAGE.slot, false); }
    renderWhoPick();
    renderLog();
    if (ME != null) { mineIfChanged(); loadMine(); }
  } catch (e) {
    setStatus(t("unreachable"), "");
  }
  // Nothing new comes in for an ended run; look less often.
  pollTimer = setTimeout(pollPublic, room && room.ended ? 60000 : POLL_MS);
}

function renderPublic() {
  $("ptotal").textContent = players.reduce((a, p) => a + p.deaths, 0);
  $("pchecks").textContent = players.reduce((a, p) => a + (p.web && p.web.total ? p.web.checked || 0 : p.checks), 0);

  // Last death, from the log: parts are ["☠ ", player, " - cause" | " ist gestorben"].
  const ld = events.find(e => e.kind === "death");
  const body = $("plastbody");
  body.innerHTML = "";
  if (ld) {
    const nm = document.createElement("div");
    nm.className = "ld-name";
    nm.append(icEl("skull"), " " + ((ld.parts[1] || {}).text || "?"));
    body.appendChild(nm);
    const tail = (ld.parts[2] || {}).text || "";
    if (tail.startsWith(" - ")) {
      const c = document.createElement("div");
      c.className = "ld-cause";
      c.textContent = tail.slice(3);
      body.appendChild(c);
    }
    const t = document.createElement("div");
    t.className = "ld-time";
    t.textContent = ago(ld.t);
    body.appendChild(t);
  } else body.innerHTML = `<div class="ld-time" style="font-size:15px">${t("noDeath")}</div>`;

  // Players: most deaths first, the leader gets a red glow.
  const max = Math.max(0, ...players.map(p => p.deaths));
  const ordered = [...players].sort((a, b) => b.deaths - a.deaths || a.slot - b.slot);
  const host = $("pplayers");
  host.innerHTML = "";
  let someoneDied = false;
  for (const p of ordered) {
    const before = prevDeaths.get(p.slot);
    const died = before != null && p.deaths > before;
    someoneDied = someoneDied || died;
    prevDeaths.set(p.slot, p.deaths);

    const c = document.createElement("div");
    c.className = "pcard" + (p.slot === mySlot ? " me" : "") + (max && p.deaths === max ? " top" : "") + (died ? " flash" : "");
    c.onclick = () => pickWho(p.slot);
    c.title = t("whoTitle");
    c.innerHTML = `<div class="nm"></div><div class="dc"><span></span><small>${t("deathsSmall")}</small></div><div class="gm"></div>`;
    c.querySelector(".nm").textContent = p.name;
    c.querySelector(".gm").textContent = prettyGame(p.game);
    c.querySelector(".dc span").append(icEl("skull"), " " + p.deaths);
    if (!p.deaths) c.querySelector(".dc").classList.add("zero");

    const pr = document.createElement("div");
    pr.className = "pr";
    if (p.web && p.web.total) {
      const x = p.web.checked || 0, y = p.web.total;
      pr.innerHTML = `<b></b><span class="bar"><i style="width:${Math.round(x / y * 100)}%"></i></span><span></span>`;
      pr.querySelector("b").textContent = `${x} / ${y}`;
      pr.lastElementChild.textContent = pct(x, y);
    } else {
      pr.innerHTML = `<b></b> ${t("checks")}`;
      pr.querySelector("b").textContent = p.checks;
    }
    c.appendChild(pr);

    if (p.last) {
      const la = document.createElement("div");
      la.className = "la";
      la.appendChild(document.createTextNode(t("last")));
      la.appendChild(itemSpan(p.last.item_name, p.last.flags, p.last.receiver));
      la.appendChild(document.createTextNode(" · " + ago(p.last.t)));
      la.title = `${p.last.item_name} → ${playerName(p.last.receiver)}\n${p.last.location_name}`;
      c.appendChild(la);
    }
    if (p.goal || p.released) {
      const g = document.createElement("div");
      g.className = "gl" + (p.goal ? "" : " rel");
      g.append(icEl(p.goal ? "emoji_events" : "undo"), " " + (p.goal ? t("goal") : t("released")));
      c.appendChild(g);
    }
    host.appendChild(c);
  }
  if (someoneDied) {
    const lc = $("plast");
    lc.classList.remove("flash"); void lc.offsetWidth; lc.classList.add("flash");
  }
}

// ---------------------------------------------------------------------------
// Public page, one player: pick yourself top left, get your own PopTracker.
// Same for every game; the server builds it from archipelago.gg + the log.
// ---------------------------------------------------------------------------
let ME = null;                   // picked slot; null = overview
let mt = null, mtSig = "", mtBusy = false, mtTab = "pop", whoApplied = false;
const mtOpen = new Set();        // open regions, kept across polls

/** Address of a player's PopTracker, e.g. /run-2/liesofp/poptracker. */
const playerUrl = slot => { const p = playerBy(slot); return slot == null || !p ? `/run-${RUN}` : `/run-${RUN}/${p.slug || p.slot}/poptracker`; };
// Back/forward between players and the overview.
window.addEventListener("popstate", () => {
  if (!PUBLIC) return;
  const m = /^\/run-\d+\/([a-z0-9-]+)\/poptracker\/?$/.exec(location.pathname);
  const p = m && players.find(x => x.slug === m[1] || String(x.slot) === m[1]);
  pickWho(p ? p.slot : null, false);
});

function renderWhoPick() {
  const sel = $("whopick");
  sel.title = t("whoTitle");
  const want = ["", ...players.map(p => String(p.slot))];
  const labels = [t("whoOverview"), ...players.map(p => `${p.name} · ${prettyGame(p.game)}`)];
  const have = [...sel.options];
  if (have.map(o => o.value).join() !== want.join() || have.map(o => o.textContent).join() !== labels.join()) {
    sel.innerHTML = "";
    want.forEach((v, i) => { const o = document.createElement("option"); o.value = v; o.textContent = labels[i]; sel.appendChild(o); });
  }
  sel.value = ME == null ? "" : String(ME);
}
$("whopick").onchange = () => pickWho($("whopick").value === "" ? null : Number($("whopick").value));
$("mtback").onclick = () => pickWho(null);

function pickWho(slot, push = true) {
  ME = slot != null && playerBy(slot) ? slot : null;
  if (push && location.pathname !== playerUrl(ME)) history.pushState(null, "", playerUrl(ME));
  mt = null; mtSig = ""; mtOpen.clear();
  $("overview").hidden = ME != null;
  $("mytrk").hidden = ME == null;
  renderWhoPick();
  // The log follows: only what concerns this player.
  renderLogWho();
  $("publogwho").value = ME == null ? "all" : "s" + ME;
  refilter();
  renderMine();
  loadMine();
  window.scrollTo({ top: 0 });
}

async function loadMine() {
  if (ME == null || mtBusy) return;
  mtBusy = true;
  const slot = ME;
  try {
    const r = await fetch(`${API}slot?slot=${slot}&sig=${encodeURIComponent(mtSig)}`);
    const j = await r.json();
    if (slot === ME && !j.same && r.ok) { mt = j; mtSig = j.sig; renderMine(); }
  } catch (e) {}
  mtBusy = false;
  // Logic still being worked out: ask again soon (ended runs poll only once a minute).
  if (ME === slot && mt && mt.logic && mt.logic.pending) setTimeout(loadMine, 2500);
}

/** Polls redraw the player view only when something on it changed. */
let mineDrawn = "";
function mineIfChanged() {
  const p = playerBy(ME);
  const s = [ME, mtSig, p && p.deaths, p && p.goal, p && p.released, LANG].join("|");
  if (s !== mineDrawn) renderMine();
}

function pstat(k, v, sub, cls) {
  const d = document.createElement("div");
  d.className = "pstat";
  d.innerHTML = `<div class="k"></div><div class="v"></div><div class="s"></div>`;
  d.querySelector(".k").textContent = k;
  d.querySelector(".v").textContent = v;
  if (cls) d.querySelector(".v").classList.add(cls);
  d.querySelector(".s").textContent = sub || "";
  return d;
}

const mtLogicOk = () => mt && mt.logic && mt.logic.regions;

function renderMine() {
  if (ME == null) return;
  const p = playerBy(ME);
  if (!p) return;
  mineDrawn = [ME, mtSig, p.deaths, p.goal, p.released, LANG].join("|");
  $("mtname").textContent = p.name;
  $("mtgame").textContent = prettyGame(p.game);
  const goal = $("mtgoal");
  goal.innerHTML = "";
  if (p.goal || p.released) {
    const s = document.createElement("span");
    s.className = "pill " + (p.goal ? "done" : "partial");
    s.append(icEl(p.goal ? "emoji_events" : "undo"), p.goal ? t("goal") : t("released"));
    goal.appendChild(s);
  }

  // Numbers on top.
  const st = $("mtstats");
  st.innerHTML = "";
  const done = mt ? mt.checked.length : (p.web && p.web.checked) || p.checks;
  const total = (mt && mt.total) || (p.web && p.web.total) || null;
  st.appendChild(pstat(t("stChecks"), total ? `${done} / ${total}` : String(done), total ? pct(done, total) : t("stChecksSub")));
  let reach = "–";
  if (mtLogicOk()) {
    const ck = new Set(mt.checked.map(c => c[0]));
    reach = String(mt.logic.reachable.filter(id => !ck.has(id)).length);
  }
  st.appendChild(pstat(t("stReach"), reach, t("stReachSub")));
  st.appendChild(pstat(t("stItems"), mt ? String(mt.received.length) : "–", t("stItemsSub")));
  st.appendChild(pstat(t("stDeaths"), String(p.deaths), "DeathLink", "err"));

  const tabs = $("mttabs");
  tabs.querySelectorAll("button.mtab").forEach(b => b.classList.toggle("on", b.dataset.mt === mtTab));
  $("mtpop").hidden = mtTab !== "pop";
  $("mtitems").hidden = mtTab !== "items";
  $("mthints").hidden = mtTab !== "hints";
  if (mtTab === "pop") renderMtPop();
  else if (mtTab === "items") renderMtItems();
  else renderMtHints();
}
$("mttabs").querySelectorAll("button.mtab").forEach(b => b.onclick = () => { mtTab = b.dataset.mt; renderMine(); });

["mtq", "mtlocked", "mtdone"].forEach(id => $(id).addEventListener("input", () => renderMtPop()));

function renderMtPop() {
  const host = $("mtregions");
  const note = $("mtnote");
  note.textContent = "";
  $("mtovl").textContent = t("ovLbl"); $("mtovr").textContent = ""; $("mtovbar").style.width = "0%";
  host.innerHTML = "";
  if (!mt) { host.innerHTML = `<div class="empty">${t("loading")}</div>`; return; }
  const L0 = mt.logic || {};
  const checkedIds = new Set(mt.checked.map(c => c[0]));
  if (!mtLogicOk()) {
    const d = document.createElement("div");
    d.className = "popinfo" + (L0.error ? " err" : "");
    d.textContent = L0.pending ? t("popCalc", { name: mt.name }) : L0.error || "";
    host.appendChild(d);
    // Without logic: at least what is done.
    if (mt.checked.length) {
      const det = document.createElement("details");
      det.className = "region";
      const sum = document.createElement("summary");
      sum.innerHTML = `<span class="rn"></span><span class="count"></span>`;
      sum.querySelector(".rn").textContent = t("doneList");
      sum.querySelector(".count").textContent = mt.checked.length;
      det.appendChild(sum);
      det.addEventListener("toggle", () => {
        if (!det.open || det.querySelector(".locs")) return;
        const wrap = document.createElement("div");
        wrap.className = "locs";
        for (const [, name] of [...mt.checked].sort((a, b) => a[1].localeCompare(b[1]))) wrap.appendChild(mtRow(name, "done"));
        det.appendChild(wrap);
      });
      host.appendChild(det);
    }
    if (mt.source === "log") note.textContent = t("srcLog");
    return;
  }

  note.textContent = t("popNote", { game: prettyGame(mt.game), n: mt.received.length, ms: L0.ms }) +
    (L0.unknown_items && L0.unknown_items.length ? t("popUnknown", { n: L0.unknown_items.length }) : "");
  const reach = new Set(L0.reachable);
  const q = $("mtq").value.trim().toLowerCase();
  const showLocked = $("mtlocked").checked, showDone = $("mtdone").checked;
  // Hints on this player's world: someone waits for what lies there.
  const wanted = new Map();
  for (const h of mt.hints) if (h.f === ME && h.r !== ME && !h.found && h.loc != null) wanted.set(h.loc, h);

  let total = 0, done = 0, open = 0, reachOpen = 0, shown = 0;
  L0.regions.forEach((r, i) => {
    const all = r.locs;
    total += all.length;
    const rDone = all.filter(([id]) => checkedIds.has(id)).length;
    done += rDone;
    const openL = all.filter(([id]) => !checkedIds.has(id));
    const nReach = openL.filter(([id]) => reach.has(id)).length;
    open += openL.length; reachOpen += nReach;
    let locs = all.filter(([id]) => checkedIds.has(id) ? showDone : (showLocked || reach.has(id)));
    const regionHit = r.name.toLowerCase().includes(q);
    if (q && !regionHit) locs = locs.filter(([, n]) => n.toLowerCase().includes(q));
    if (!locs.length) return;
    shown++;

    const det = document.createElement("details");
    det.className = "region";
    det.dataset.done = openL.length ? "0" : "1";
    det.open = !!q || mtOpen.has(r.name);
    det.addEventListener("toggle", () => det.open ? mtOpen.add(r.name) : mtOpen.delete(r.name));
    const sum = document.createElement("summary");
    sum.innerHTML = `<span class="idx">${String(i + 1).padStart(2, "0")}</span><span class="rn"></span>` +
      `<span class="count"></span><span class="bar"><i style="width:${all.length ? Math.round(rDone / all.length * 100) : 0}%"></i></span>`;
    sum.querySelector(".rn").textContent = r.name;
    sum.querySelector(".count").textContent = t("reachN", { n: nReach }) + (showLocked ? " · " + t("openN", { n: openL.length }) : "");
    const nh = locs.filter(([id]) => wanted.has(id)).length;
    if (nh) {
      const hc = document.createElement("span");
      hc.className = "hcount";
      hc.append(icEl("lightbulb"), " " + nh);
      sum.querySelector(".rn").after(hc);
    }
    det.appendChild(sum);
    const fill = () => {
      if (det.querySelector(".locs")) return;
      const wrap = document.createElement("div");
      wrap.className = "locs";
      // Reachable first, then hinted, then the rest, each in the world's order.
      const rank = ([id]) => checkedIds.has(id) ? 3 : reach.has(id) ? (wanted.has(id) ? 0 : 1) : 2;
      for (const [id, name] of [...locs].sort((a, b) => rank(a) - rank(b))) {
        const row = mtRow(name, checkedIds.has(id) ? "done" : reach.has(id) ? "reach" : "locked");
        const h = wanted.get(id);
        if (h) {
          row.classList.add("hinted");
          const s = document.createElement("span");
          s.className = "hintfor";
          s.textContent = t("hintHere", { i: h.i, p: playerName(h.r) });
          row.appendChild(s);
        }
        wrap.appendChild(row);
      }
      det.appendChild(wrap);
    };
    if (det.open) fill();
    det.addEventListener("toggle", () => { if (det.open) fill(); });
    host.appendChild(det);
  });
  $("mtovbar").style.width = (open ? Math.round(reachOpen / open * 100) : 100) + "%";
  $("mtovr").textContent = t("ovPop", { r: reachOpen, o: open, d: done, t: total });
  if (!shown) host.innerHTML = `<div class="empty">${q ? t("noHits") : !open ? ic("task_alt") + t("allDone") : !reachOpen ? t("popNothing") : t("noHits")}</div>`;
}

function mtRow(name, state) {
  const row = document.createElement("div");
  row.className = "loc" + (state === "done" ? " done" : state === "locked" ? " locked" : "");
  const mark = document.createElement("span");
  mark.className = "mark" + (state === "reach" ? " reach" : "");
  mark.appendChild(icEl(state === "done" ? "check" : state === "reach" ? "radio_button_checked" : "lock"));
  mark.title = state === "done" ? t("doneMark") : state === "reach" ? t("reachable") : t("locked");
  row.appendChild(mark);
  const n = document.createElement("span");
  n.className = "n";
  n.textContent = name;
  row.appendChild(n);
  return row;
}

function renderMtItems() {
  const host = $("mtitems");
  host.innerHTML = "";
  if (!mt) { host.innerHTML = `<div class="empty">${t("loading")}</div>`; return; }
  const groups = new Map();
  for (const g of mt.received) {
    const x = groups.get(g.i) || { n: 0, f: 0, last: null };
    x.n++; x.f |= g.f; x.last = g;
    groups.set(g.i, x);
  }
  const sec = isec(t("itemsGot"), t("itemsGotSub", { n: mt.received.length }));
  if (!groups.size) sec.appendChild(irow(null, t("noItems"), ""));
  [...groups].sort((a, b) => (b[1].f & 1) - (a[1].f & 1) || b[1].n - a[1].n || a[0].localeCompare(b[0]))
    .forEach(([name, x]) => sec.appendChild(irow(x.n + "x", itemSpan(name, x.f), x.last.p === ME ? "" : t("from", { p: playerName(x.last.p) }))));
  const timed = mt.received.filter(g => g.t).sort((a, b) => b.t - a.t).slice(0, 30);
  if (timed.length) {
    const nw = isec(t("itemsNew"), t("itemsNewSub"));
    for (const g of timed) nw.appendChild(irow(fmtTime(g.t), itemSpan(g.i, g.f), t("from", { p: playerName(g.p) }) + " · " + g.l));
    host.appendChild(nw);
  }
  host.appendChild(sec);
}

function renderMtHints() {
  const host = $("mthints");
  host.innerHTML = "";
  if (!mt) { host.innerHTML = `<div class="empty">${t("loading")}</div>`; return; }
  const mineH = mt.hints.filter(h => h.r === ME).sort((a, b) => a.found - b.found);
  const a = isec(t("hintsMine"), t("hintsMineSub", { n: mineH.length }));
  if (!mineH.length) a.appendChild(irow(null, t("noHints"), ""));
  for (const h of mineH) a.appendChild(irow(h.found ? icEl("check") : "", itemSpan(h.i, h.flags), playerName(h.f) + " · " + h.l));
  host.appendChild(a);
  const want = mt.hints.filter(h => h.f === ME && h.r !== ME && !h.found);
  const b = isec(t("hintsWanted"), t("hintsWantedSub", { n: want.length }));
  if (!want.length) b.appendChild(irow(null, t("noHints"), ""));
  for (const h of want) b.appendChild(irow(null, itemSpan(h.i, h.flags, h.r), h.l));
  host.appendChild(b);
}

// ---------------------------------------------------------------------------
// Start
// ---------------------------------------------------------------------------
if (!RUN) location.href = "/";
else {
  applyI18n();
  langToggle(() => { renderHeader(); if (room) { const st = liveStatus(); setStatus(st[0], st[1]); } renderPublic(); renderLog(); renderWhoPick(); renderMine(); });
  $("pub").hidden = false;
  $("whopick").hidden = false;
  pollPublic();
}
</script>
